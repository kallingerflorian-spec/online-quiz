<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kahoot Host</title>
    <!-- QR-Code Bibliothek laden -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; background: #1368ce; color: white; text-align: center; padding: 20px; }
        .box { background: white; color: #333; padding: 20px; border-radius: 10px; display: inline-block; margin: 15px; min-width: 300px; vertical-align: top; }
        .option-desc { font-size: 20px; text-align: left; margin: 5px 0; }
        button { font-size: 22px; padding: 10px 25px; border: none; background: #33cc33; color: white; border-radius: 5px; cursor: pointer; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    </style>
</head>
<body>
    <h1>Kahoot Quiz-Zentrale</h1>
    <button onclick="nextQuestion()">Nächste Frage starten</button>
    <br>

    <!-- QR Code Bereich für Handys -->
    <div class="box" id="join-box">
        <h3>Mit dem Handy einwählen:</h3>
        <div id="qrcode"></div>
        <p id="url-text" style="font-size:12px; word-break:break-all;"></p>
    </div>

    <div class="box" id="question-box">
        <h2 id="host-question">Drücke oben auf Start!</h2>
        <div id="host-options"></div>
    </div>

    <div class="box">
        <h2>Rangliste</h2>
        <div id="scoreboard">Noch keine Spieler da.</div>
    </div>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        const ws = new WebSocket(protocol + window.location.host + "/ws/host");

        // QR Code automatisch für die aktuelle URL generieren
        const joinUrl = window.location.origin;
        document.getElementById("url-text").innerText = joinUrl;
        new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 180,
            height: 180
        });

        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            
            if (msg.type === "question") {
                document.getElementById("join-box").style.display = "none"; // QR Code ausblenden wenn Spiel läuft
                document.getElementById("host-question").innerText = msg.data.question;
                
                let optionsHtml = "";
                for (const [key, val] of Object.entries(msg.data.options)) {
                    optionsHtml += `<div class="option-desc"><strong>${key}:</strong> ${val}</div>`;
                }
                if(msg.data.type === "sort") {
                    optionsHtml += "<p><em>⚠️ Millionenshow-Modus: Bringe die Optionen in die richtige Reihenfolge!</em></p>";
                }
                document.getElementById("host-options").innerHTML = optionsHtml;
                
            } else if (msg.type === "scores" || msg.type === "game_over") {
                let html = "<ol style='text-align:left;'>";
                // Sortiere Rangliste nach Punkten
                const sorted = Object.entries(msg.data).sort((a,b) => b[1] - a[1]);
                for (const [player, score] of sorted) {
                    html += `<li><strong>${player}</strong>: ${Math.round(score)} Punkte</li>`;
                }
                html += "</ol>";
                document.getElementById("scoreboard").innerHTML = html;
                
                if(msg.type === "game_over") {
                     document.getElementById("host-question").innerText = "🏆 Spiel beendet! Endstand:";
                     document.getElementById("host-options").innerHTML = "";
                }
            }
        };

        function nextQuestion() {
            ws.send(JSON.stringify({ type: "next_question" }));
        }
    </script>
</body>
</html>
