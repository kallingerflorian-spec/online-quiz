<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title> MA-Überprüfung </title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

</head>

<body>

<div class="container">

<div class="logo">

    <img src="{{ url_for('static', filename='Logo.png') }}" alt="Logo">

    <h1>Online Quiz</h1>

</div>
    
<div id="login">

<input
id="name"
type="text"
placeholder="Dein Name">


<button id="join">
Beitreten
</button>

</div>

<div id="waiting" style="display:none;">

<h2>⏳ Warten auf den Host...</h2>

</div>

<div id="game" style="display:none;">

<h2 id="question"></h2>

<h3>

Zeit:
<span id="timer">30</span>

</h3>

<ul id="list">

</ul>

<button id="submit">

Antwort senden

</button>

</div>

<div id="result"></div>

</div>

<script>

const socket = io();
socket.on("connect", function () {
    console.log("Verbunden:", socket.id);
});

socket.on("connect_error", function (err) {
    console.error("Socket-Fehler:", err);
});

socket.on("join_error", function (data) {
    alert(data.message);
});
let sortable;

// -----------------------------

document.getElementById("join").onclick = function () {

    const name = document.getElementById("name").value.trim();

    if (name === "") {
        alert("Bitte Namen eingeben.");
        return;
    }

    socket.emit("join", {
        name: name
    });

};

// -----------------------------

socket.on("joined",function(){

    document.getElementById("login").style.display="none";

    document.getElementById("waiting").style.display="block";

});

// -----------------------------
socket.on("start_question", function(question){

    document.getElementById("result").innerHTML = "";
    document.getElementById("submit").disabled = false;

    document.getElementById("waiting").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("question").innerHTML = question.title;

    const list=document.getElementById("list");

    list.innerHTML="";

    let items=[...question.correct_order];

    items.sort(()=>Math.random()-0.5);

    items.forEach(function(item){

        const li=document.createElement("li");

        li.className="card";

        li.innerHTML=item;

        list.appendChild(li);

    });

    sortable=new Sortable(list,{
        animation:150
    });

});

// -----------------------------

socket.on("timer",function(data){

    document.getElementById("timer").innerHTML=data.time;

});

// -----------------------------

socket.on("time_up",function(){

    document.getElementById("submit").disabled=true;

});

// -----------------------------

document.getElementById("submit").onclick=function(){

    const cards=document.querySelectorAll("#list li");

    let order=[];

    cards.forEach(function(card){

        order.push(card.innerHTML);

    });

    socket.emit("submit_order",{

        order:order

    });

    document.getElementById("submit").disabled=true;

}

// -----------------------------

socket.on("answer_result", function(data){

    const result = document.getElementById("result");

    if(data.correct){

        result.innerHTML = "<h2 style='color:green;'>✅ Richtig!</h2>";

    }else{

        result.innerHTML = "<h2 style='color:red;'>❌ Leider falsch!</h2>";

    }

});

socket.on("game_restarted", function(){

    document.getElementById("game").style.display = "none";
    document.getElementById("waiting").style.display = "none";
    document.getElementById("login").style.display = "block";

    document.getElementById("result").innerHTML = "";
    document.getElementById("name").value = "";
    document.getElementById("submit").disabled = false;

});

    
</script>

</body>

</html>
