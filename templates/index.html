<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Python Kahoot - Reihung</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #46178f; color: white; }
        ul { list-style: none; padding: 0; }
        li { background: white; color: black; margin: 10px auto; padding: 10px; width: 300px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>{{ question }}</h1>
    <form action="/submit" method="POST">
        <ul id="sortable">
            {% for item in items %}
                <li>
                    <input type="hidden" name="order[]" value="{{ item }}">
                    {{ item }}
                </li>
            {% endfor %}
        </ul>
        <button type="submit" style="padding: 10px 20px; font-size: 16px;">Antwort absenden</button>
    </form>
</body>
</html>
